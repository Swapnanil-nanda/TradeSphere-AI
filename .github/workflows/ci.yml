name: TradeSphere AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Java 21 Backend Test & Package
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test Suite (Java 21 / Spring Boot 3.4.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Spring Boot Tests (19 Integration & Unit Tests)
        run: mvn clean test -B

      - name: Package Production JAR
        run: mvn package -DskipTests -B

      - name: Archive Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradesphere-backend-jar
          path: backend-spring/target/tradesphere-backend-*.jar
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 2. Backend Container Build Validation (Render Target)
  # ----------------------------------------------------------------------------
  backend-docker-build:
    name: Backend Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring
          file: ./backend-spring/Dockerfile
          push: false
          tags: tradesphere-backend:latest

  # ----------------------------------------------------------------------------
  # 3. Next.js 14 Frontend Build Validation (Vercel Target)
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Production Build (Next.js 14 / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js Production Build Validation
        env:
          NEXT_PUBLIC_API_URL: https://mock.tradesphere.ai
          NODE_ENV: production
        run: npm run build

  # ----------------------------------------------------------------------------
  # 4. Security & Secret Hygiene Audit
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Hygiene Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify No Sensitive Files Committed
        run: |
          echo "Scanning for forbidden files (.env, private keys, secrets)..."
          FORBIDDEN_FILES=$(find . -type f \( -name "*.env" -o -name "*.env.local" -o -name "*.pem" -o -name "*.key" \) ! -name "*.example" ! -path "*/node_modules/*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Unsanctioned secret files detected in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No forbidden secret files detected. Repository clean."
