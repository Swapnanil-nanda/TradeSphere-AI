name: TradeSphere AI Monorepo CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-sast:
    name: Security, Secrets & SAST Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Automated Secret & Credential Scanning
        run: python scripts/security/secret_scanner.py

      - name: Static Application Security Testing (SAST)
        run: node scripts/security/sast_scan.js

      - name: Automated Dependency Manifest Audit
        run: node scripts/security/dependency_audit.js

  frontend-validation:
    name: Frontend (Next.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Strict TypeScript Compilation (Zero Build Errors Allowed)
        working-directory: frontend
        run: npm run type-check

      - name: Strict ESLint Verification (Zero Lint Errors Allowed)
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Unit & E2E Test Suite (56 Tests)
        working-directory: frontend
        run: npm test

      - name: Production Webpack Build Verification
        working-directory: frontend
        run: npm run build

  backend-spring-validation:
    name: Spring Boot Authoritative OMS (Java 21 LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Run All Spring Boot Tests (52 Tests)
        working-directory: backend-spring
        run: mvn clean test --batch-mode

  backend-node-validation:
    name: Microstructure Feed Engine (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Node Microstructure Test Suite (4 Tests)
        working-directory: backend
        run: npm test

      - name: Run High-Throughput Order Book Load Benchmark
        run: node --test tests/load/orderbook_load_test.js

      - name: Run Cross-Service API Flow Integration Tests
        run: node --test tests/integration/api_flow.test.js

  quant-engine-validation:
    name: Quantitative Research Engine (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-engine/requirements.txt

      - name: Install Quant Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r quant-engine/requirements.txt pytest httpx

      - name: Run 7-Agent Quantitative Test Suite (34 Tests)
        run: pytest quant-engine/tests -v
