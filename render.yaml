# ==============================================================================
# TradeSphere AI - Render Blueprint Specification (Infrastructure as Code)
# ==============================================================================

services:
  - type: web
    name: tradesphere-backend
    runtime: docker
    rootDir: backend-spring
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Supply your Neon PostgreSQL connection string in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALLOW_EPHEMERAL_FALLBACK
        value: "true"
      - key: JAVA_OPTS
        value: "-XX:+UseSerialGC -Xms96m -Xmx224m -XX:MaxMetaspaceSize=112m -XX:ReservedCodeCacheSize=48m -Xss256k -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000
      - key: SWAGGER_ENABLED
        value: "false"
