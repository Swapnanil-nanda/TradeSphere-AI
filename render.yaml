# ==============================================================================
# TradeSphere AI - Render Blueprint Specification (Infrastructure as Code)
# Deploy via: Render Dashboard -> Blueprints -> Connect Repository
# ==============================================================================

services:
  - type: web
    name: tradesphere-backend
    runtime: docker
    dockerfilePath: ./backend-spring/Dockerfile
    dockerContext: ./backend-spring
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Supply your Neon PostgreSQL connection string in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://tradesphere-ai.vercel.app,https://*.vercel.app,http://localhost:3000
      - key: SWAGGER_ENABLED
        value: "true"
